[package]
name = "ak-platform-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"

[dependencies]
ak-flow-executor = { workspace = true }
ak-platform = { workspace = true }
authentik-client.workspace = true
eyre.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["time", "net"] }
tracing = { workspace = true }
url.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true

[target.'cfg(unix)'.dependencies]
# Unix socket only, so no TLS backend.
incus-client = { version = "0.1.1", default-features = false }
# Console websocket over the same unix socket.
futures-util.workspace = true
tokio-tungstenite.workspace = true
