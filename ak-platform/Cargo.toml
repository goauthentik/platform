[package]
name = "ak-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[[example]]
name = "log"

[[example]]
name = "grpc_client"

[dependencies]
base64 = "0.23.0"
hyper-util = { workspace = true }
log = { workspace = true }
pbjson = { workspace = true }
pbjson-types = { workspace = true }
prost = "0.14"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true }
dirs-next = "2.0.0"
eyre = { workspace = true }
ssh-agent-lib = { workspace = true }
http = "1.4.2"
bytes = "1.11.1"
http-body-util = "0.1.3"
http-body = "1.0.1"
simplelog = "0.12.2"
tokio-stream = "0.1.18"
tokio-util = "0.7"
interprocess = { version = "2", features = ["tokio"] }
chrono = { workspace = true }
notify = "8.2.0"
sysinfo = { version = "0.39.3", default-features = false, features = ["system"] }
tracing = { workspace = true }
env_filter = "2.0.0"
serde_with = "3.21.0"
tower-http = { version = "0.7.0", features = ["trace"] }

[target.'cfg(target_os = "macos")'.dependencies]
oslog = "0.2.0"
# Used by `net::elevate::macos` / `net::xpc` to call `SMAppService` and to
# talk raw XPC — no maintained high-level binding exists for either, so both
# go through objc2's `msg_send!`/blocks directly.
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[target.'cfg(unix)'.dependencies]
syslog = "7.0.0"
libc = "0.2.186"
# `net::elevate::linux` spawns the CTRL relay helper through `pkexec`.
tokio = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
eventlog = "0.4.0"
# SDDL literals for the named-pipe DACLs in `net::server`; must stay on the
# same major as the `widestring` re-exported through `interprocess`.
widestring = "1"
# `net::elevate::windows` builds a locked-down rendezvous pipe and launches
# the CTRL relay helper elevated.
tokio = { workspace = true, features = ["net"] }
uuid = { workspace = true }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "io-util"] }
tempfile = { workspace = true }
