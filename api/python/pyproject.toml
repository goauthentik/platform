[project]
name = "authentik-agent-api"
version = "0.73.0"
description = "gRPC client for the authentik agent"
requires-python = ">=3.10"
dependencies = [
    "grpclib>=0.4.9,<0.5",
    "protobuf>=7.36.2",
    "pywin32>=311; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
