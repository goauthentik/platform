[project]
name = "authentik-agent-api"
version = "0.73.0"
description = "gRPC client for the authentik agent"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.85.1",
    "protobuf>=7.36.2",
    "psutil>=6.0; sys_platform == 'win32'",
    "pywin32>=311; sys_platform == 'win32'",
]

[dependency-groups]
# psutil is only a runtime dependency on Windows, the tests need it everywhere.
dev = ["psutil>=6.0", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
