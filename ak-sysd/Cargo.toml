[package]
name = "ak-sysd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ak-sysd"
path = "src/main.rs"

[dependencies]
ak-flow-executor = { workspace = true }
ak-meta = { workspace = true }
ak-platform = { workspace = true }
ak-platform-facts = { path = "../ak-platform-facts" }
ak-platform-keyring = { workspace = true }
authentik-client = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
eyre = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
pbjson-types = { workspace = true }
rand = "0.10"
reqwest = { workspace = true }
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
sentry = { workspace = true }
sentry-tower = { workspace = true, features = ["http"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ssh-key = { workspace = true, features = ["ed25519", "getrandom", "std"] }
subtle = "2"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["time", "signal"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
reqwest-middleware = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

# glibc never returns the large transient allocations made by the in-process
# osquery engine (see `ak-platform-facts`), which strands ~700MB of free heap
# in its arenas after every device checkin. jemalloc releases dirty pages back
# to the OS on a decay timer instead.
#
# `unprefixed_malloc_on_supported_platforms` is load-bearing, not a nicety:
# most of that allocation happens in osquery's statically linked C++, which
# calls plain `malloc`/`free`. Without the unprefixed symbols, jemalloc would
# only back Rust's `#[global_allocator]` and the C++ side would keep using
# glibc, leaving the actual problem untouched. On platforms where overriding
# `malloc` is unsupported (macOS) the feature is inert and jemalloc stays
# prefixed, which is a graceful downgrade rather than a build failure.
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { version = "0.7.0", features = [
    "unprefixed_malloc_on_supported_platforms",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
winreg = { workspace = true, features = ["serialization-serde"] }
windows = { workspace = true, features = [
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_Foundation",
] }

[build-dependencies]
windows_exe_info = { workspace = true }

[dev-dependencies]
ak-agent = { workspace = true }
httptest = { workspace = true }
