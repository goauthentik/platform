[package]
name = "ak-sysd"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "ak-sysd"
path = "src/main.rs"

[dependencies]
ak-platform = { path = "../ak-platform" }
ak-platform-keyring = { path = "../ak-platform-keyring" }
ak-platform-facts = { path = "../ak-platform-facts" }
ak-meta = { path = "../ak-meta" }
authentik-client = { workspace = true }
tokio = { workspace = true, features = ["time", "signal"] }
tokio-util = "0.7"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4"
serde = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
sentry = { workspace = true }
sentry-tower = { version = "0.48.2", features = ["http"] }
tower-http = { version = "0.7.0", features = ["trace"] }
eyre = { workspace = true }
chrono = { workspace = true }
pbjson-types = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.23.0"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
ak-agent = { path = "../ak-agent" }
ak-flow-executor = { path = "../ak-flow-executor" }
reqwest = { workspace = true }
ssh-key = { version = "0.6", features = ["ed25519", "getrandom", "std"] }
subtle = "2"
rpassword = "7"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56", features = ["serialization-serde"] }
windows = { version = "0.62.2", features = [
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_Foundation",
] }
