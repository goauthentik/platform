name: _deploy (reusable)

on:
  workflow_call:
    inputs:
      upload-repo-artifact:
        description: Upload 'repo' artifact (needed by Netlify deploy in CI; not needed for release)
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - parallel:
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6
            with:
              path: ./bin
          - run: |
              sudo apt-get remove --purge man-db
      - uses: ./.github/actions/repo
        id: repo
        with:
          package-path: bin/
          gpg-private-key: "${{ secrets.GPG_PRIVATE }}"
      - name: Upload repository
        if: ${{ inputs.upload-repo-artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: repo
          path: ./repo
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: all-packages
          path: ./bin
