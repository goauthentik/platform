name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  id-token: write

jobs:
  test_rs:
    name: Test (rust)
    strategy:
      fail-fast: false
      matrix:
        target:
          - ak-agent
          - ak-agent-desktop
          - ak-api-cli
          - ak-api-cli-gen
          - ak-browser-support
          - ak-cli
          - ak-flow-executor
          - ak-meta
          - ak-meta-macros
          - ak-platform
          - ak-platform-authz
          - ak-platform-facts
          - ak-platform-keyring
          - ak-platform-serde-policy
          - ak-sysd
          # platform specific crates, included below
          # - ak-nss
          # - ak-pam
          # - ee/wcp
        platform:
          - macos-26
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - windows-2025
        include:
          - platform: windows-2025
            target: ee/wcp
          - platform: ubuntu-26.04
            target: ak-nss
          - platform: ubuntu-26.04-arm
            target: ak-nss
          - platform: ubuntu-26.04
            target: ak-pam
          - platform: ubuntu-26.04-arm
            target: ak-pam
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - parallel:
          - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
            with:
              rustflags: ""
              build-warnings: warn
          - uses: ./.github/actions/setup-toolchain
            with:
              platform: ${{ matrix.platform }}
      # install-action writes ~/.cargo/bin, which the toolchain's rust-cache
      # snapshots and restores, so it must not overlap with it.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-llvm-cov nextest
      - run: |
          make ${{ matrix.target }}/test
        env:
          # ee/wcp is deliberately absent: _build-rs.yml ships it without
          # crt-static, so its tests have to be built the same way.
          RUST_BUILD_FLAGS: ${{ ((matrix.target == 'ak-platform-facts' || matrix.target == 'ak-sysd') && matrix.platform == 'windows-2025') && '-C target-feature=+crt-static' || '' }}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: rs-${{ matrix.platform }}-${{ matrix.target }}
          files: ${{ github.workspace }}/cache/llvm-cov-target.json
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: rs-${{ matrix.platform }}-${{ matrix.target }}
          files: ${{ github.workspace }}/cache/llvm-cov-target.json
          report_type: test_results
  test_swift:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        target:
          - ee/psso
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: cache/
          key: target-cache-psso-xcode-27-${{ hashFiles('ee/psso/**') }}
          restore-keys: |
            target-cache-psso-xcode-27-
      - run: |
          brew install xcresultparser xcbeautify
          make ${{ matrix.target }}/test XCB_EXTRA_ARGS='CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO'
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: swift
          files: ${{ github.workspace }}/cache/psso/coverage.xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: swift
          files: ${{ github.workspace }}/cache/psso/junit.xml
          report_type: test_results
  test_api:
    name: Test (api)
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-26
          - ubuntu-26.04
          - windows-2025
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: api/go/go.mod
          cache-dependency-path: api/go/go.sum
      - run: make api-test
  lint_rs:
    name: Lint (rust)
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-26
          - ubuntu-26.04
          - windows-2025
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - parallel:
          - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
            with:
              rustflags: ""
              build-warnings: warn
          - run: make ci-install-deps
      - uses: ./.github/actions/setup-toolchain
        with:
          platform: ${{ matrix.platform }}
      # see test_rs: must not overlap with setup-rust-toolchain
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny
      - run: make lint-rs-ci
  lint_js:
    name: Lint
    strategy:
      fail-fast: false
      matrix:
        target:
          - browser-ext
          - ak-cli/ui
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "${{ matrix.target }}/package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - run: make ${{ matrix.target }}/lint
  lint_spellcheck:
    name: Lint (spellcheck)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - run: make lint-spellcheck
  build_rs_e2e:
    uses: ./.github/workflows/_build-rs.yml
    with:
      rust_build_flags: "-C instrument-coverage -C codegen-units=1"
      artifact_suffix: "-e2e"
      platforms: '["ubuntu-26.04"]'
    secrets: inherit
  package_linux_e2e:
    needs: build_rs_e2e
    uses: ./.github/workflows/_package-linux.yml
    with:
      artifact_suffix: "-e2e"
      platforms: '["ubuntu-26.04"]'
    secrets: inherit
  test_rs_e2e:
    name: Test (e2e ${{ matrix.ubuntu_version }} ${{ matrix.ubuntu_variant }})
    needs: [package_linux_e2e]
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version:
          # 25.10 is EOL and no longer on images.linuxcontainers.org.
          - "24.04"
          - "26.04"
        ubuntu_variant:
          - cloud
          - desktop
    runs-on: ubuntu-26.04
    env:
      # Read by ak-platform-e2e when building the base image (defaults: 24.04, cloud).
      AK_E2E_UBUNTU_VERSION: ${{ matrix.ubuntu_version }}
      AK_E2E_UBUNTU_VARIANT: ${{ matrix.ubuntu_variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          build-warnings: warn
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6
        with:
          pattern: authentik_{package-linux-ubuntu-26.04,ubuntu-26.04_ak-agent,ubuntu-26.04_ak-cli,ubuntu-26.04_ak-nss,ubuntu-26.04_ak-pam}-e2e
          path: bin/
          merge-multiple: true
      # see test_rs: must not overlap with setup-rust-toolchain
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-llvm-cov nextest
      - run: chmod +x bin/agent/ak-agent bin/cli/ak bin/sysd/ak-sysd
      # authentik startup and the Incus setup are independent; overlap them.
      - parallel:
          - uses: goauthentik/action-setup-authentik@5b35e5951a1ec761847711a5d8170dbd67675526 # v3.3
            id: setup
            with:
              version: beta
              sentry_env: goauthentik-platform-ci
              blueprints_path: ./hack/authentik/blueprints
              wait: true
              enterprise_license: true
              enterprise_license_users_internal: 100
              enterprise_license_users_external: 100
          - name: Set up Incus
            run: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
              test -c /dev/kvm
              sudo apt-get update
              # genisoimage builds the agent:config disk for VMs without incus-agent.
              sudo apt-get install -y incus genisoimage
              sudo incus admin init --minimal
              sudo usermod -aG incus-admin "$USER"
              # Docker sets FORWARD to DROP, which cuts the VMs off from apt.
              sudo iptables -P FORWARD ACCEPT
      - env:
          AK_TOKEN: ${{ steps.setup.outputs.admin_token }}
          AK_URL: ${{ steps.setup.outputs.http_url }}
        run: |
          ./hack/authentik/wait.sh
      - name: Build base VM image
        run: |
          sg incus-admin -c "make test-e2e-image"
      - env:
          AK_PASSWORD: ${{ steps.setup.outputs.admin_password }}
          AK_TOKEN: ${{ steps.setup.outputs.admin_token }}
          AK_URL: ${{ steps.setup.outputs.http_url }}
          # License retrieval needs an OIDC token, which external PRs don't get
          NEXTEST_PROFILE: ${{ steps.setup.outputs.enterprise_license_key == '' && 'no-enterprise' || 'default' }}
        # sg: the incus-admin membership above only applies to new logins.
        run: |
          sg incus-admin -c "make test-e2e-ci"
      - run: make test-e2e-convert
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: rs-e2e-${{ matrix.ubuntu_version }}-${{ matrix.ubuntu_variant }}
          files: ${{ github.workspace }}/cache/llvm-cov-target.json
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: rs-e2e-${{ matrix.ubuntu_version }}-${{ matrix.ubuntu_variant }}
          files: ${{ github.workspace }}/cache/llvm-cov-target.json
          report_type: test_results
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: rs-e2e-${{ matrix.ubuntu_version }}-${{ matrix.ubuntu_variant }}
          files: ${{ github.workspace }}/cache/rs-e2e-coverage.lcov
