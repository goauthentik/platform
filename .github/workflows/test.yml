name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  id-token: write
  # Workflow-level permissions cap what called workflows can request, and
  # _builder-image.yml needs to push to GHCR.
  packages: write

jobs:
  builder:
    uses: ./.github/workflows/_builder-image.yml

  test_rs:
    name: Test (rust)
    needs: builder
    strategy:
      fail-fast: false
      matrix:
        target:
          - ak-agent
          - ak-agent-desktop
          - ak-api-cli-gen
          - ak-browser-support
          - ak-cli
          - ak-nss
          - ak-pam
          - ak-platform
          - ak-platform-facts
          - ak-sysd
        platform:
          - macos-26
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
        exclude:
          - platform: windows-2025
            target: ak-pam
          - platform: windows-2025
            target: ak-nss
          - platform: macos-26
            target: ak-pam
          - platform: macos-26
            target: ak-nss
    runs-on: ${{ matrix.platform }}
    # Linux tests run inside the builder image, which bakes in the pinned
    # toolchain, cargo-llvm-cov/nextest and the osquery toolchain.
    # ak-agent-desktop needs webkit2gtk-4.1, which bullseye doesn't have, so it
    # stays on the runner. An empty string means "no container".
    container: ${{ startsWith(matrix.platform, 'ubuntu') && matrix.target != 'ak-agent-desktop' && needs.builder.outputs.image || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - if: ${{ !startsWith(matrix.platform, 'ubuntu') || matrix.target == 'ak-agent-desktop' }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
      - if: ${{ !startsWith(matrix.platform, 'ubuntu') || matrix.target == 'ak-agent-desktop' }}
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-llvm-cov nextest
      - if: ${{ (matrix.target == 'ak-platform-facts' || matrix.target == 'ak-sysd') && matrix.platform == 'windows-2025' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Force real MSVC link.exe
        # ilammy/msvc-dev-cmd puts MSVC's tools on PATH, but Git for Windows'
        # own usr/bin/link.exe (a hardlink utility, not a linker) still wins
        # PATH resolution on this runner image, breaking cargo's link step
        # ("/usr/bin/link: extra operand ..."). Pin the real one explicitly.
        if: ${{ (matrix.target == 'ak-platform-facts' || matrix.target == 'ak-sysd') && matrix.platform == 'windows-2025' }}
        shell: pwsh
        run: |
          $linkExe = (Get-Command link.exe -All | Where-Object { $_.Source -notlike '*\Git\*' } | Select-Object -First 1).Source
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linkExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: |
          make ${{ matrix.target }}/test
        env:
          RUST_BUILD_FLAGS: ${{ ((matrix.target == 'ak-platform-facts' || matrix.target == 'ak-sysd') && matrix.platform == 'windows-2025') && '-C target-feature=+crt-static' || '' }}
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: rs-${{ matrix.platform }}-${{ matrix.target }}
          files: ${{ github.workspace }}/cache/llvm-cov-target.json
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: rs-${{ matrix.platform }}-${{ matrix.target }}
          files: ${{ github.workspace }}/cache/llvm-cov-target.json
          report_type: test_results
  test_swift:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        target:
          - ee/psso
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: cache/
          key: target-cache-psso-macos-15-${{ hashFiles('ee/psso/**') }}
          restore-keys: |
            target-cache-psso-macos-15-
      - run: |
          brew install xcresultparser
          make ${{ matrix.target }}/test XCB_EXTRA_ARGS='CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO'
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: swift
          files: ${{ github.workspace }}/cache/psso/coverage.xml
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: swift
          files: ${{ github.workspace }}/cache/psso/junit.xml
          report_type: test_results
  lint_rs:
    name: Lint (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
      - run: make ci-install-deps
      - name: Install osquery-toolchain
        run: |
          curl -fsSL -o /tmp/osquery-toolchain.tar.xz \
            "https://github.com/osquery/osquery-toolchain/releases/download/1.3.0/osquery-toolchain-1.3.0-x86_64.tar.xz"
          sudo tar xf /tmp/osquery-toolchain.tar.xz -C /usr/local
          rm /tmp/osquery-toolchain.tar.xz
      - run: make lint-rs
  lint_js:
    name: Lint
    strategy:
      fail-fast: false
      matrix:
        target:
          - browser-ext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: "${{ matrix.target }}/package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - run: make ${{ matrix.target }}/lint
  lint_cpp:
    name: Lint
    strategy:
      fail-fast: false
      matrix:
        target:
          - ee/wcp
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - run: make ${{ matrix.target }}/lint
  build_rs_e2e:
    uses: ./.github/workflows/_build-rs.yml
    with:
      rust_build_flags: "-C instrument-coverage -C codegen-units=1"
      artifact_suffix: "-e2e"
      platforms: '["ubuntu-24.04"]'
    secrets: inherit
  package_linux_e2e:
    needs: build_rs_e2e
    uses: ./.github/workflows/_package-linux.yml
    with:
      artifact_suffix: "-e2e"
      platforms: '["ubuntu-24.04"]'
    secrets: inherit
  test_rs_e2e:
    name: Test (e2e)
    needs: [package_linux_e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-llvm-cov nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6
        with:
          name: authentik_package-linux-ubuntu-24.04-e2e
          path: bin/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6
        with:
          name: authentik_ubuntu-24.04_ak-agent-e2e
          path: bin/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6
        with:
          name: authentik_ubuntu-24.04_ak-cli-e2e
          path: bin/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6
        with:
          name: authentik_ubuntu-24.04_ak-nss-e2e
          path: bin/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6
        with:
          name: authentik_ubuntu-24.04_ak-pam-e2e
          path: bin/
      - run: chmod +x bin/agent/ak-agent bin/cli/ak bin/sysd/ak-sysd
      - uses: goauthentik/action-setup-authentik@3a1d4f81e5a29709c173f8b74250b1781e298bf9 # v3.1
        id: setup
        with:
          version: beta
          sentry_env: goauthentik-platform-ci
          blueprints_path: ./hack/authentik/blueprints
          wait: true
          enterprise_license: true
          enterprise_license_users_internal: 100
          enterprise_license_users_external: 100
      - env:
          AK_TOKEN: ${{ steps.setup.outputs.admin_token }}
          AK_URL: ${{ steps.setup.outputs.http_url }}
        run: |
          ./hack/authentik/wait.sh
      - run: make containers/e2e/ci-build
      - env:
          AK_PASSWORD: ${{ steps.setup.outputs.admin_password }}
          AK_TOKEN: ${{ steps.setup.outputs.admin_token }}
          AK_URL: ${{ steps.setup.outputs.http_url }}
        run: |
          make test-e2e-ci
      - run: |
          sudo chmod -R 777 ./ak-platform-e2e/coverage
          make test-e2e-convert
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: rs-e2e
          files: ${{ github.workspace }}/cache/llvm-cov-target.json
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: rs-e2e
          files: ${{ github.workspace }}/cache/llvm-cov-target.json
          report_type: test_results
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        if: ${{ always() }}
        with:
          use_oidc: true
          flags: rs-e2e
          files: ${{ github.workspace }}/cache/rs-e2e-coverage.lcov
