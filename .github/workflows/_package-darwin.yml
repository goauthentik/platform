name: _package-darwin

on:
  workflow_call:
    inputs:
      is_release:
        type: boolean
        default: false

jobs:
  package:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - parallel:
          - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6
            with:
              name: authentik_macos-26_ak-agent-desktop
              path: bin/
          - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6
            with:
              name: authentik_macos-26_ak-cli
              path: bin/
          - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6
            with:
              name: authentik_macos-26_ak-sysd
              path: bin/
          - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6
            with:
              name: authentik_macos-26_ak-browser-support
              path: bin/
          - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6
            with:
              name: authentik_xcode-27_psso
              path: bin/
      - run: tar -xf bin/psso.tar -C bin && rm bin/psso.tar

      - id: check
        env:
          CERT: ${{ secrets.APPLE_SIGN_CERT }}
        run: |
          if [ -n "$CERT" ]; then
            echo "has-signing-cert=true" >> $GITHUB_OUTPUT
          else
            echo "has-signing-cert=false" >> $GITHUB_OUTPUT
          fi
          echo 'XCB_EXTRA_ARGS=' >> $GITHUB_ENV
      - uses: ./.github/actions/macos-signing
        if: steps.check.outputs.has-signing-cert == 'true'
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGN_CERT }}
          p12-password: ${{ secrets.APPLE_SIGN_CERT_PASSWORD }}
          installer-p12-file-base64: ${{ secrets.APPLE_SIGN_CERT_INSTALLER }}
          ac-issuer: ${{ secrets.APPLE_AC_ISSUER }}
          ac-kid: ${{ secrets.APPLE_AC_KID }}
          ac-key: ${{ secrets.APPLE_AC_KEY }}
      - if: steps.check.outputs.has-signing-cert == 'true'
        env:
          AC_KEY: ${{ secrets.APPLE_AC_KEY }}
          AC_KID: ${{ secrets.APPLE_AC_KID }}
          AC_ISSUER: ${{ secrets.APPLE_AC_ISSUER }}
        run: |
          echo "$AC_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "MACOS_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> $GITHUB_ENV
          echo "MACOS_NOTARY_KEY_ID=$AC_KID" >> $GITHUB_ENV
          echo "MACOS_NOTARY_ISSUER=$AC_ISSUER" >> $GITHUB_ENV
          echo "MACOS_INSTALLER_CERT=Developer ID Installer: Authentik Security Inc. (232G855Y8N)" >> $GITHUB_ENV
      - if: steps.check.outputs.has-signing-cert == 'false'
        run: echo 'MACOS_SIGN_CERT=-' >> $GITHUB_ENV
      - shell: bash
        run: |
          make vpkg/macos/package
        env:
          AK_IS_RELEASE: ${{ inputs.is_release }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: authentik_package-macos
          path: bin/vpkg/macos/
