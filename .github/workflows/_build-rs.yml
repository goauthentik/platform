name: _build-rust

on:
  workflow_call:
    inputs:
      is_release:
        type: boolean
        default: false
      rust_build_flags:
        type: string
        default: ""
      artifact_suffix:
        type: string
        default: ""
      platforms:
        type: string
        default: '["macos-26","ubuntu-24.04","ubuntu-24.04-arm","windows-2025"]'
    outputs:
      artifact:
        value: ${{ jobs.build.outputs.artifact-id }}

jobs:
  builder:
    uses: ./.github/workflows/_builder-image.yml

  build:
    name: Build
    needs: builder
    strategy:
      fail-fast: false
      matrix:
        target:
          - ak-agent
          - ak-agent-desktop
          - ak-browser-support
          - ak-cli
          - ak-nss
          - ak-pam
          - ak-sysd
        platform: ${{ fromJSON(inputs.platforms) }}
        exclude:
          # pam & nss are linux-only targets
          - target: ak-pam
            platform: macos-26
          - target: ak-pam
            platform: windows-2025
          - target: ak-nss
            platform: macos-26
          - target: ak-nss
            platform: windows-2025
    runs-on: ${{ matrix.platform }}
    # Linux builds run inside the prebuilt builder image. ak-agent-desktop is
    # the exception: it needs webkit2gtk-4.1, which bullseye doesn't have, so it
    # keeps building on the runner. An empty string means "no container".
    container: ${{ startsWith(matrix.platform, 'ubuntu') && matrix.target != 'ak-agent-desktop' && needs.builder.outputs.image || '' }}
    env:
      CARGO_TERM_COLOR: always
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - if: ${{ matrix.target == 'ak-agent-desktop' }}
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
      - if: ${{ matrix.target == 'ak-agent-desktop' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: "${{ matrix.target }}/package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      # ubuntu builds run inside the builder container image, which already
      # bakes in the pinned toolchain - only macos/windows need it installed
      # (and cached) on the runner itself. ak-agent-desktop is not containerised,
      # so it needs the toolchain on the ubuntu runner too.
      - if: ${{ !startsWith(matrix.platform, 'ubuntu') || matrix.target == 'ak-agent-desktop' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml') }}
      - if: ${{ !startsWith(matrix.platform, 'ubuntu') || matrix.target == 'ak-agent-desktop' }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache: false
      - if: ${{ matrix.target == 'ak-sysd' && matrix.platform == 'windows-2025' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Force real MSVC link.exe
        # ilammy/msvc-dev-cmd puts MSVC's tools on PATH, but Git for Windows'
        # own usr/bin/link.exe (a hardlink utility, not a linker) still wins
        # PATH resolution on this runner image, breaking cargo's link step
        # ("/usr/bin/link: extra operand ..."). Pin the real one explicitly.
        if: ${{ matrix.target == 'ak-sysd' && matrix.platform == 'windows-2025' }}
        shell: pwsh
        run: |
          $linkExe = (Get-Command link.exe -All | Where-Object { $_.Source -notlike '*\Git\*' } | Select-Object -First 1).Source
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linkExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - if: ${{ !startsWith(matrix.platform, 'ubuntu') || matrix.target == 'ak-agent-desktop' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml') }}
      # /usr/local/cargo is CARGO_HOME inside the builder image; ~/.cargo is the
      # runner's. Only one of the two exists per job, the other matches nothing.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /usr/local/cargo/registry
            /usr/local/cargo/git
            cache/
          key: target-cache-v2-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
          restore-keys: |
            target-cache-v2-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}-
            target-cache-v2-${{ matrix.platform }}-
      - run: |
          make ${{ matrix.target }}/build
        env:
          RUST_BUILD_FLAGS: ${{ (matrix.target == 'ak-sysd' && matrix.platform == 'windows-2025') && '-C target-feature=+crt-static ' || '' }}${{ inputs.rust_build_flags }}
          AK_IS_RELEASE: ${{ inputs.is_release }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        id: artifact
        with:
          name: authentik_${{ matrix.platform }}_${{ matrix.target }}${{ inputs.artifact_suffix }}
          path: bin/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /usr/local/cargo/registry
            /usr/local/cargo/git
            cache/
          key: target-cache-v2-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
