[package]
name = "ak-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ak-agent"
path = "src/main.rs"

[dependencies]
ak-meta = { workspace = true }
ak-platform = { workspace = true }
ak-platform-authz = { path = "../ak-platform-authz" }
ak-platform-keyring = { workspace = true }
authentik-client = { workspace = true }
chrono = { workspace = true }
eyre = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
oauth2 = { workspace = true }
pbjson-types = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
sentry = { workspace = true }
sentry-tower = { workspace = true, features = ["http"] }
serde = { workspace = true }
sha2 = { workspace = true }
signature = "2"
ssh-agent-lib = { workspace = true }
ssh-encoding = "0.3"
ssh-key = { workspace = true, features = ["ed25519", "getrandom", "std"] }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
waitgroup = "0.1.2"

[build-dependencies]
windows_exe_info = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
