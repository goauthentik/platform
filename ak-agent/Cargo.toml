[package]
name = "ak-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "ak-agent"
path = "src/main.rs"

[dependencies]
ak-meta = { path = "../ak-meta" }
ak-platform = { path = "../ak-platform" }
ak-platform-authz = { path = "../ak-platform-authz" }
ak-platform-keyring = { path = "../ak-platform-keyring" }
authentik-client = { workspace = true }
chrono = { workspace = true }
eyre = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
pbjson-types = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = "0.5.2"
sentry = { workspace = true }
sentry-tower = { version = "0.49.0", features = ["http"] }
serde = { workspace = true }
sha2 = { workspace = true }
signature = "2"
ssh-agent-lib = { workspace = true }
ssh-encoding = "0.3"
ssh-key = { version = "0.6", features = ["ed25519", "getrandom", "std"] }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
waitgroup = "0.1.2"

[build-dependencies]
windows_exe_info = "0.5.2"
