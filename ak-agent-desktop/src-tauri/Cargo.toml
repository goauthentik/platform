[package]
name = "ak-agent-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ak_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
ak-agent = { workspace = true }
eyre = { workspace = true }
hex = { workspace = true }
ak-platform = { workspace = true }
ak-platform-authz = { workspace = true }
ak-platform-keyring = { workspace = true }
ak-meta = { workspace = true }
authentik-client = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-sentry = "0.8"
reqwest = { workspace = true }
semver = "1"
sentry = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
