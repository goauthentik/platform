# yaml-language-server: $schema=https://nfpm.goreleaser.com/static/schema.json
name: "libnss-authentik"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION_PKG}"
description: |
  NSS module for authentik
vendor: "Authentik Security Inc."
homepage: "https://goauthentik.io"
maintainer: "Authentik Security Inc."
license: "MIT"
section: security
contents:
  - src: ../../bin/nss/libnss_authentik.so
    dst: "/usr/lib/${DEB_BUILD_GNU_TYPE}/libnss_authentik.so.2"
    file_info:
      mode: 0644
    packager: deb
    expand: true
  - src: ../../bin/nss/libnss_authentik.so
    dst: "/usr/lib64/libnss_authentik.so.2"
    file_info:
      mode: 0644
    packager: rpm
  # AppArmor. Every confined profile that does user/group lookups includes
  # <abstractions/nameservice>, and glibc loads our NSS module into it, so the
  # drop-in below is the general fix (the same place upstream wires up authd).
  - src: ./nss/_deb/apparmor/abstractions/nameservice.d/authentik
    dst: /etc/apparmor.d/abstractions/nameservice.d/authentik
    file_info:
      mode: 0644
    packager: deb
    type: config
  # unix_chkpwd additionally needs disconnected-path rules, which are specific
  # to its profile and so cannot live in the nameservice drop-in.
  - src: ./nss/_deb/apparmor/local/unix-chkpwd
    dst: /etc/apparmor.d/local/unix-chkpwd
    file_info:
      mode: 0644
    packager: deb
    type: config
overrides:
  deb:
    depends:
      - "authentik-sysd"
      - "libc6"

    scripts:
      postinstall: ./nss/_deb/postinst.sh
  rpm:
    depends:
      - "authentik-sysd"
      - "glibc"
