[package]
name = "ak-platform-keyring"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ak-platform = { path = "../ak-platform" }
eyre = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
keyring-core = { version = "1.0.0" }
windows-native-keyring-store = "1.1.0"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1.0", features = ["rt-tokio-crypto-rust"] }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "io-util"] }
