syntax = "proto3";

package agent_ctrl;
option swift_prefix = "";

import "agent.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service AgentCtrl {
  rpc ListProfiles(google.protobuf.Empty) returns (ListProfilesResponse);
  rpc Setup(SetupRequest) returns (SetupResponse);
  rpc PrepareDpopKey(PrepareDpopKeyRequest) returns (PrepareDpopKeyResponse);
  rpc SwitchProfile(agent.RequestHeader) returns (agent.ResponseHeader);
  rpc CurrentProfile(google.protobuf.Empty) returns (CurrentProfileResponse);
}

message SetupRequest {
  agent.RequestHeader header = 1;
  string authentik_url = 2;
  string app_slug = 3;
  string client_id = 4;
  string access_token = 5;
  string refresh_token = 6;
}

message SetupResponse {
  agent.ResponseHeader header = 1;
}

// Establishes (generating if needed) the DPoP key for a profile before the
// device flow starts, since the resulting thumbprint must ride the initial
// device-authorization request. header.profile names the profile being
// enrolled; it need not exist yet — this call creates it.
message PrepareDpopKeyRequest {
  agent.RequestHeader header = 1;
  string authentik_url = 2;
  string app_slug = 3;
  string client_id = 4;
}

message PrepareDpopKeyResponse {
  agent.ResponseHeader header = 1;
  string dpop_jkt = 2;
  // True if backed by the platform Secure Enclave/TPM; false if this device
  // had no usable hardware backend and a software key was used instead.
  bool hardware_backed = 3;
}

message Profile {
  string name = 1;
  string username = 2;
  string authentik_url = 3;
  google.protobuf.Timestamp last_renewed = 4;
  google.protobuf.Timestamp next_renew = 5;
  bool dpop_bound = 6;
}

message ListProfilesResponse {
  agent.ResponseHeader header = 1;
  repeated Profile profiles = 2;
}

message CurrentProfileResponse {
  agent.ResponseHeader header = 1;
  string profile = 2;
}
