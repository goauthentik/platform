syntax = "proto3";

package sys_auth_apple;
option swift_prefix = "";

service SystemAuthApple {
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
}

message RegisterUserRequest {
  string user_secure_enclave_key = 1;
  string enclave_key_id = 2;
  string user_auth = 3;
}

message RegisterUserResponse {
  string username = 1;
}

message RegisterDeviceRequest {
  string device_signing_key = 1;
  string device_encryption_key = 2;
  string enc_key_id = 3;
  string sign_key_id = 4;
}

message RegisterDeviceResponse {
  string client_id = 1;
  string issuer = 2;
  string token_endpoint = 3;
  string jwks_endpoint = 4;
  string audience = 5;
  string nonce_endpoint = 6;
  string device_token = 7;

  // Biometric requirements for the user Secure Enclave key. Mirrors the members
  // of Apple's userSecureEnclaveKeyBiometricPolicy OptionSet: one requirement
  // (CURRENT_SET or ANY) plus any number of modifiers. Empty means no biometric
  // policy is applied.
  enum BiometricPolicy {
    UNSPECIFIED = 0;
    TOUCH_ID_OR_WATCH_CURRENT_SET = 1;
    TOUCH_ID_OR_WATCH_ANY = 2;
    REUSE_DURING_UNLOCK = 3;
    PASSWORD_FALLBACK = 4;
  }
  repeated BiometricPolicy biometric_policies = 8;
}
