[package]
name = "authentik-client"
version = "0.50.3"
authors = ["hello@goauthentik.io"]
description = "Making authentication simple."
license = "MIT"
edition = "2024"
repository = "https://github.com/authentik-community/client-rust.git"

[lints.rust]
non_snake_case = "allow"

[lints.rustdoc]
invalid_html_tags = "allow"

[lints.clippy]
derivable_impls = "allow"
empty_docs = "allow"
into_iter_on_ref = "allow"
large_enum_variant = "allow"
needless_return = "allow"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
chrono = { version = "^0.4",  features = ["serde"] }
tokio = { version = "^1.46.0", features = ["fs"] }
tokio-util = { version = "^0.7", features = ["codec"] }
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "stream", "query", "form"] }
reqwest-middleware = { version = "^0.5", features = ["json", "multipart", "query", "form"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
