[workspace]
resolver = "3"
members = [
    "ak-agent",
    "ak-agent-desktop/src-tauri",
    "ak-api-cli",
    "ak-api-cli-gen",
    "ak-browser-support",
    "ak-cli",
    "ak-flow-executor",
    "ak-meta",
    "ak-meta-macros",
    "ak-nss",
    "ak-pam",
    "ak-platform-authz",
    "ak-platform-facts",
    "ak-platform-e2e",
    "ak-platform-keyring",
    "ak-platform",
    "ak-sysd",
    # Windows-only. `make lint-rs` excludes these off Windows, since
    # credprovider is Win32-only and browser-host is built on WebView2.
    "ee/wcp/wire",
    "ee/wcp/credprovider",
    "ee/wcp/browser-host",
    "ee/wcp/e2e",
]

[workspace.package]
version = "0.72.2"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
debug = "limited"
split-debuginfo = "packed"
strip = "debuginfo"

[workspace.dependencies]
ak-agent = { path = "ak-agent" }
ak-api-cli = { path = "ak-api-cli" }
ak-api-cli-gen = { path = "ak-api-cli-gen" }
ak-ee-wcp-wire = { path = "ee/wcp/wire" }
ak-flow-executor = { path = "ak-flow-executor" }
ak-meta = { path = "ak-meta" }
ak-platform = { path = "ak-platform" }
ak-platform-keyring = { path = "ak-platform-keyring" }
authentik-client = { git = "https://github.com/goauthentik/client-rust", rev = "d608f835c32c64346ebeb199cb48810080890123", version = "2026.11.0-rc1", default-features = false, features = [
    "rustls",
] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "= 0.6.5"
eyre = "= 0.6.14"
hyper-util = "0.1.20"
log = { version = "0.4.32", features = ["kv"] }
pbjson = "0.9.0"
pbjson-types = "0.9.0"
psl = "2"
sentry = { version = "0.49.0", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls", "tower", "tracing"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ssh-agent-lib = "0.6.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
tonic = { version = "0.14" }
tonic-prost = { version = "0.14" }
tower = { version = "0.5.3", features = ["util"] }
tracing = { version = "0.1.44", features = ["log-always"] }
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }
whoami = "2.1.0"
oauth2 = { version = "5.0.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "cookies"] }
tracing-subscriber = "0.3"
tempfile = "3"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23.0"
clap_complete = "4"
core-foundation = "0.10"
ctor = "1.0.7"
dtor = "1.0.5"
httptest = "0.16"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
libc = "0.2.186"
proc-macro2 = "1"
prost = "0.14"
quote = "1"
reqwest-middleware = "0.5.2"
sentry-tower = "0.49.0"
ssh-key = "0.6"
syn = "3"
sysinfo = { version = "0.39.6", default-features = false }
tauri = "2"
tauri-build = "2"
tokio-util = "0.7"
tower-http = "0.7.0"
windows_exe_info = "0.5.2"
zbus = "5"
winreg = { version = "0.56", features = ["serialization-serde"] }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
    "Win32_Security_Credentials",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_NetManagement",
    "Win32_System_SystemInformation",
    "Win32_Storage_EnhancedStorage",
    # `NtOpenDirectoryObject` — no Win32 wrapper exists for opening an
    # arbitrary Object Manager directory (`BaseNamedObjects`) the way
    # `OpenDesktopW` does for desktops.
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    # `ICredentialProviderUser::GetValue` returns a PROPVARIANT, so the e2e
    # harness needs these to implement that interface for `SetUserArray`.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
