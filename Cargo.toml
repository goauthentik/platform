[workspace]
resolver = "3"
members = [
    "ak-agent",
    "ak-agent-desktop/src-tauri",
    "ak-api-cli-gen",
    "ak-browser-support",
    "ak-cli",
    "ak-flow-executor",
    "ak-meta",
    "ak-meta-macros",
    "ak-nss",
    "ak-pam",
    "ak-platform-authz",
    "ak-platform-facts",
    "ak-platform-e2e",
    "ak-platform-keyring",
    "ak-platform",
    "ak-sysd",
    # Windows-only. `make lint-rs` excludes these off Windows, since
    # credprovider is Win32-only and cef-host's build script fetches and
    # compiles CEF.
    "ee/wcp/wire",
    "ee/wcp/credprovider",
    "ee/wcp/cef-host",
    "ee/wcp/e2e",
]

[workspace.package]
version = "0.60.1"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
debug = "limited"
split-debuginfo = "packed"
strip = "debuginfo"

[workspace.dependencies]
ak-api-cli-gen = { path = "ak-api-cli-gen" }
authentik-client = { git = "https://github.com/goauthentik/client-rust", version = "2026.8.0-rc1" , default-features = false, features = ["rustls"] }
chrono = { version = "0.4.45", features = ["serde"] }
color-eyre = "= 0.6.5"
eyre = "= 0.6.12"
hyper-util = "0.1.20"
log = { version = "0.4.32", features = ["kv"] }
pbjson = "0.9.0"
pbjson-types = "0.9.0"
sentry = { version = "0.49.0", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls", "tower", "tracing"] }
sentry_eyre = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ssh-agent-lib = "0.6.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
tonic = { version = "0.14" }
tonic-prost = { version = "0.14" }
tower = { version = "0.5.3", features = ["util"] }
tracing = { version = "0.1.44", features = ["log-always"] }
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }
whoami = "2.1.0"
oauth-device-flows = "0.1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "cookies"] }
tracing-subscriber = "0.3"
tempfile = "3"
sha2 = "0.11"
hex = "0.4"
winreg = { version = "0.56", features = ["serialization-serde"] }
# Shared by the ee/wcp crates only. Deliberately older than the 0.62 that
# ak-sysd pins inline: the credential-provider code is written against 0.61's
# `#[implement]` and UI::Shell surface. Both resolve side by side.
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_Security_Credentials",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_NetManagement",
    "Win32_System_SystemInformation",
    "Win32_Storage_EnhancedStorage",
    # `ICredentialProviderUser::GetValue` returns a PROPVARIANT, so the e2e
    # harness needs these to implement that interface for `SetUserArray`.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
